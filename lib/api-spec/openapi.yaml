openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TradeCore Pro - Binance Spot Trading Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: >-
      Authentication (Multi-user Phase). Each user registers their own
      account (username/password) â€” see middleware/auth.ts for the full
      design rationale.
  - name: credentials
    description: >-
      Per-user Binance API credential management (Multi-user Phase) â€”
      encrypted at rest, linked only to the owning account.
  - name: bot
    description: Bot control operations
  - name: scanner
    description: Live market scanner
  - name: market
    description: Live market monitor and connection health
  - name: trades
    description: Trade log operations
  - name: stats
    description: Performance statistics
  - name: memory
    description: Adaptive learning memory
  - name: config
    description: Bot configuration
  - name: strategies
    description: Multi-strategy management and performance
  - name: knowledge
    description: >-
      Read-only market knowledge: gated performance cells, multiple-comparison
      control, and confidence calibration. Never reachable from the scan loop â€”
      nothing here can influence a trading decision.

# Every operation requires ONE of these by default (either is sufficient â€”
# see components.securitySchemes below). /healthz and /auth/* override this
# with their own empty `security: []` since they must stay reachable without
# credentials (health checks, and obtaining credentials in the first place).
security:
  - sessionCookie: []
  - basicAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      security: []
      description: >-
        Multi-user Phase: creates a new account (username + password, hashed
        with scrypt) and immediately logs in, setting the same signed
        session cookie POST /auth/login issues. Each account only ever risks
        its own Binance credentials/funds, so registration is open to
        anyone who can reach the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 12
      responses:
        "201":
          description: Account created â€” session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid username or password
        "409":
          description: Username already taken

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in to an existing account
      security: []
      description: >-
        Exchanges a user's username/password for a signed session cookie
        (12h expiry). Rate-limited separately and much more strictly than
        the rest of the API (10 attempts / 15 min / IP) since this is the
        one meaningful brute-force target on an otherwise-authenticated API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in â€” session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Invalid username or password

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether the current request is authenticated
      security: []
      description: >-
        Lets the frontend check auth state on load without risking a 401
        (and without the global rate limiter mistaking routine polling for
        abuse).
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get bot status
      description: Returns the current bot runtime state
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/start:
    post:
      operationId: startBot
      tags: [bot]
      summary: Start the bot
      description: Starts the trading bot engine
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the bot
      description: Stops the trading bot engine
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/reset-risk-pause:
    post:
      operationId: resetRiskPause
      tags: [bot]
      summary: Clear the consecutive-risk-violation trading pause
      description: >-
        Trading auto-pauses after 3 consecutive risk violations (realized loss
        exceeding the planned maximum). This clears the violation counter so
        trading resumes on the next scan. Review the flagged trades on the
        Trade Log before resetting.
      responses:
        "200":
          description: Risk pause cleared (or was not active)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string

  /scanner:
    get:
      operationId: getScannerData
      tags: [scanner]
      summary: Get live scanner table
      description: Returns current scanner rows for all watched pairs
      responses:
        "200":
          description: Scanner rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerRow"

  /bot/decisions:
    get:
      operationId: getBotDecisions
      tags: [bot]
      summary: Get strategy decision trace
      description: Returns the full per-symbol pipeline decision (market data â†’ indicators â†’ signal â†’ risk â†’ order) from the most recent scan
      responses:
        "200":
          description: Decision trace rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolDecision"

  /decisions/funnel:
    get:
      operationId: getDecisionFunnel
      tags: [bot]
      summary: Where this section's signals went over a recent window
      description: >
        Aggregates the decision journal by rejection stage so the conversion
        from "a strategy produced a signal" to "a trade was placed" is one
        number rather than a forensic exercise. The engine can reject every
        signal it generates for days without any single screen saying so â€”
        this is that screen's data. Occurrences are summed, not row-counted,
        because identical repeated decisions dedupe onto one row.
      parameters:
        - name: hours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
      responses:
        "200":
          description: Signal funnel for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionFunnel"

  /decisions:
    get:
      operationId: getDecisionJournal
      tags: [bot]
      summary: Get the persistent strategy decision journal
      description: >
        Every trade a strategy genuinely considered â€” executed, approved but
        not taken (lost allocation / portfolio risk / order failure), or
        rejected by the strategy's own reasoning â€” with the full written
        DecisionReport. Newest first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return rows with id lower than this (cursor pagination)
          schema: { type: integer }
        - name: kind
          in: query
          schema: { type: string, enum: [executed, approved_not_taken, rejected] }
        - name: strategyId
          in: query
          schema: { type: string }
        - name: symbol
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Decision journal rows, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyDecisionEntry"

  /journal:
    get:
      operationId: getJournal
      tags: [bot]
      summary: Get the per-trade post-mortem journal
      description: >
        A factual, deterministic post-mortem for every closed LIVE trade â€”
        outcome, realized R-multiple, an evidence-based execution grade, and
        itemised findings (fees vs. move, stop-in-noise, momentum decay,
        etc.). Generated automatically the moment a trade closes; this
        endpoint only reads it. Backtest trades never get an entry. Newest
        first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return rows with id lower than this (cursor pagination)
          schema: { type: integer }
        - name: symbol
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [win, loss, breakeven] }
      responses:
        "200":
          description: Journal entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"

  /copilot/inbox:
    get:
      operationId: getCopilotInbox
      tags: [bot]
      summary: Co-Pilot recommendations awaiting a decision
      description: >
        TradePlans the engine produced in Co-Pilot mode and handed to you
        instead of executing. Each is byte-identical to what AutoPilot would
        have traded for the same scan â€” the planFingerprint proves it.
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses. Defaults to `created` (the actionable ones).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recommendations, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationList"

  /copilot/recommendations/{id}:
    get:
      operationId: getRecommendationWorkspace
      tags: [bot]
      summary: One recommendation's full picture â€” the workspace
      description: >
        The plan, the five-stage reasoning that produced it (Market Data â†’
        Indicators â†’ Signal â†’ Risk Checks â†’ Order) captured at the moment it
        was created, and what taking it would do to the portfolio right now.
        Read-only; changes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationWorkspace"
        "404":
          description: Not found (wrong id, or belongs to another user/section)

  /copilot/recommendations/{id}/execute:
    post:
      operationId: executeRecommendation
      tags: [bot]
      summary: Approve and execute a recommendation
      description: >
        Re-validates before placing anything: expiry, price drift measured in
        the plan's own R units, and every account-level risk gate. Approval
        means "is this still a good idea?", not "place this order". A plan that
        fails becomes `blocked`, which is terminal and read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Outcome, with every re-validation check that ran
