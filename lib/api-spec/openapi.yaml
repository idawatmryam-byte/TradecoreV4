    BotConfig:
      type: object
      required: [positionSizeUsdt, riskPercent, maxOpenPositions, maxPortfolioRiskPercent, dailyLossLimitUsdt, maxSymbolConcentrationPercent, maxNetExposurePercent, maxCorrelatedExposurePercent, correlationThreshold, correlationUnknownPolicy, confidenceThreshold, riskModel, stopLossPercent, takeProfitPercent, maxLossUsdt, targetProfitUsdt, cooldownMinutes, scanIntervalSeconds, pairs, testnet, backtestMode, highFrequencyTestMode, marketType, leverage, marginMode, broker, executionTarget, mode, demoStartingBalanceUsdt]
      properties:
        broker:
          type: string
          enum: [binance, oanda]
          description: "Which broker this section's engine connects to — binance (crypto section) or oanda (forex section). Fixed per section, not user-editable."
        marketType:
          type: string
          enum: [spot, futures, forex]
          description: "Spot (no leverage, long-only), USDⓈ-M Futures (leveraged, long+short), or forex (OANDA, margin-based)"
        leverage:
          type: integer
          description: "Futures leverage multiplier. Ignored in spot mode (always 1)."
        marginMode:
          type: string
          enum: [isolated, cross]
          description: "Futures margin mode. Ignored in spot mode."
        positionSizeUsdt:
          type: number
        riskPercent:
          type: number
          description: "% of account balance to risk per trade (0 = fixed positionSizeUsdt)"
        maxOpenPositions:
          type: integer
        maxPortfolioRiskPercent:
          type: number
          description: "Maximum % of total balance across all open positions"
        dailyLossLimitUsdt:
          type: number
        maxSymbolConcentrationPercent:
          type: number
          description: "Max notional (entry price × qty) allowed in a single symbol, as % of balance. Default 100 (permissive — no effective limit) until tightened."
        maxNetExposurePercent:
          type: number
          description: "Max net long-short notional exposure across all open positions, as % of balance. Default 200 (permissive — no effective limit) until tightened."
        maxCorrelatedExposurePercent:
          type: number
          description: "Max notional across one correlated cluster (the candidate plus every open position measured to be the same directional bet), as % of balance. Default 200 (permissive) until tightened."
        correlationThreshold:
          type: number
          description: "Reinforcement level (r adjusted for trade direction) at which two symbols count as the same bet."
        correlationUnknownPolicy:
          type: string
          enum: [allow, block]
          description: "What to do when a pair has too little shared history to measure. Never silently treated as uncorrelated."
        confidenceThreshold:
          type: integer
        riskModel:
          type: string
          enum: [percent, dollar]
          description: "How SL/TP are decided. 'percent': SL/TP are a % of price (stopLossPercent/takeProfitPercent) and size comes from riskPercent/positionSizeUsdt. 'dollar': SL/TP prices and size are derived from a fixed max-dollar-loss and target-dollar-profit per trade (maxLossUsdt/targetProfitUsdt)."
        stopLossPercent:
          type: number
          description: "Stop-loss distance as a % below entry price (used when riskModel = percent)"
        takeProfitPercent:
          type: number
          description: "Take-profit distance as a % above entry price (used when riskModel = percent)"
        maxLossUsdt:
          type: number
          description: "Dollar mode: max dollars to lose on one trade (net of fees)"
        targetProfitUsdt:
          type: number
          description: "Dollar mode: desired dollar profit on one trade (net of fees)"
        cooldownMinutes:
          type: integer
        scanIntervalSeconds:
          type: integer
        pairs:
          type: array
          items:
            type: string
        executionTarget:
          type: string
          enum: [demo, live]
          description: "Where approved TradePlans execute. 'demo' = TradeCore's internal simulation on live market data (no broker, no API keys, no real money); 'live' = real orders through the connected broker."
        mode:
          type: string
          enum: [research, copilot, autopilot]
          description: "What happens once a TradePlan exists. 'autopilot' executes it; 'copilot' records it for the user to approve; 'research' never executes. The intelligence pipeline is identical in all three."
        demoStartingBalanceUsdt:
          type: number
          description: "Virtual starting balance for the demo account. Its live balance is this plus the realised P&L of its closed demo trades."
        testnet:
          type: boolean
        backtestMode:
          type: boolean
        highFrequencyTestMode:
          type: boolean
          description: "Testnet/demo only: when on, the live engine overrides its turnover-limiting gates (cooldown, confidence floor, toxic hours, max positions, daily-loss breaker, max holding time) to generate a high volume of trades for end-to-end testing. Ignored on real-money keys. Not a profitable configuration."
        alertWebhookUrl:
          type: string
          nullable: true
          description: "Discord / Telegram / Slack incoming-webhook URL for risk alerts"

