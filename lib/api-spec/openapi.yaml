openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TradeCore Pro - Binance Spot Trading Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: >-
      Authentication (Multi-user Phase). Each user registers their own
      account (username/password) — see middleware/auth.ts for the full
      design rationale.
  - name: credentials
    description: >-
      Per-user Binance API credential management (Multi-user Phase) —
      encrypted at rest, linked only to the owning account.
  - name: bot
    description: Bot control operations
  - name: scanner
    description: Live market scanner
  - name: market
    description: Live market monitor and connection health
  - name: trades
    description: Trade log operations
  - name: stats
    description: Performance statistics
  - name: memory
    description: Adaptive learning memory
  - name: config
    description: Bot configuration
  - name: strategies
    description: Multi-strategy management and performance
  - name: knowledge
    description: >-
      Read-only market knowledge: gated performance cells, multiple-comparison
      control, and confidence calibration. Never reachable from the scan loop —
      nothing here can influence a trading decision.

# Every operation requires ONE of these by default (either is sufficient —
# see components.securitySchemes below). /healthz and /auth/* override this
# with their own empty `security: []` since they must stay reachable without
# credentials (health checks, and obtaining credentials in the first place).
security:
  - sessionCookie: []
  - basicAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      security: []
      description: >-
        Multi-user Phase: creates a new account (username + password, hashed
        with scrypt) and immediately logs in, setting the same signed
        session cookie POST /auth/login issues. Each account only ever risks
        its own Binance credentials/funds, so registration is open to
        anyone who can reach the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 12
      responses:
        "201":
          description: Account created — session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid username or password
        "409":
          description: Username already taken

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in to an existing account
      security: []
      description: >-
        Exchanges a user's username/password for a signed session cookie
        (12h expiry). Rate-limited separately and much more strictly than
        the rest of the API (10 attempts / 15 min / IP) since this is the
        one meaningful brute-force target on an otherwise-authenticated API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in — session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Invalid username or password

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether the current request is authenticated
      security: []
      description: >-
        Lets the frontend check auth state on load without risking a 401
        (and without the global rate limiter mistaking routine polling for
        abuse).
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get bot status
      description: Returns the current bot runtime state
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/start:
    post:
      operationId: startBot
      tags: [bot]
      summary: Start the bot
      description: Starts the trading bot engine
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the bot
      description: Stops the trading bot engine
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/reset-risk-pause:
    post:
      operationId: resetRiskPause
      tags: [bot]
      summary: Clear the consecutive-risk-violation trading pause
      description: >-
        Trading auto-pauses after 3 consecutive risk violations (realized loss
        exceeding the planned maximum). This clears the violation counter so
        trading resumes on the next scan. Review the flagged trades on the
        Trade Log before resetting.
      responses:
        "200":
          description: Risk pause cleared (or was not active)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string

  /scanner:
    get:
      operationId: getScannerData
      tags: [scanner]
      summary: Get live scanner table
      description: Returns current scanner rows for all watched pairs
      responses:
        "200":
          description: Scanner rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerRow"

  /bot/decisions:
    get:
      operationId: getBotDecisions
      tags: [bot]
      summary: Get strategy decision trace
      description: Returns the full per-symbol pipeline decision (market data → indicators → signal → risk → order) from the most recent scan
      responses:
        "200":
          description: Decision trace rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolDecision"

  /decisions:
    get:
      operationId: getDecisionJournal
      tags: [bot]
      summary: Get the persistent strategy decision journal
      description: >
        Every trade a strategy genuinely considered — executed, approved but
        not taken (lost allocation / portfolio risk / order failure), or
        rejected by the strategy's own reasoning — with the full written
        DecisionReport. Newest first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return rows with id lower than this (cursor pagination)
          schema: { type: integer }
        - name: kind
          in: query
          schema: { type: string, enum: [executed, approved_not_taken, rejected] }
        - name: strategyId
          in: query
          schema: { type: string }
        - name: symbol
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Decision journal rows, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyDecisionEntry"

  /journal:
    get:
      operationId: getJournal
      tags: [bot]
      summary: Get the per-trade post-mortem journal
      description: >
        A factual, deterministic post-mortem for every closed LIVE trade —
        outcome, realized R-multiple, an evidence-based execution grade, and
        itemised findings (fees vs. move, stop-in-noise, momentum decay,
        etc.). Generated automatically the moment a trade closes; this
        endpoint only reads it. Backtest trades never get an entry. Newest
        first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return rows with id lower than this (cursor pagination)
          schema: { type: integer }
        - name: symbol
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [win, loss, breakeven] }
      responses:
        "200":
          description: Journal entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"

  /copilot/inbox:
    get:
      operationId: getCopilotInbox
      tags: [bot]
      summary: Co-Pilot recommendations awaiting a decision
      description: >
        TradePlans the engine produced in Co-Pilot mode and handed to you
        instead of executing. Each is byte-identical to what AutoPilot would
        have traded for the same scan — the planFingerprint proves it.
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses. Defaults to `created` (the actionable ones).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recommendations, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationList"

  /copilot/recommendations/{id}:
    get:
      operationId: getRecommendationWorkspace
      tags: [bot]
      summary: One recommendation's full picture — the workspace
      description: >
        The plan, the five-stage reasoning that produced it (Market Data →
        Indicators → Signal → Risk Checks → Order) captured at the moment it
        was created, and what taking it would do to the portfolio right now.
        Read-only; changes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationWorkspace"
        "404":
          description: Not found (wrong id, or belongs to another user/section)

  /copilot/recommendations/{id}/execute:
    post:
      operationId: executeRecommendation
      tags: [bot]
      summary: Approve and execute a recommendation
      description: >
        Re-validates before placing anything: expiry, price drift measured in
        the plan's own R units, and every account-level risk gate. Approval
        means "is this still a good idea?", not "place this order". A plan that
        fails becomes `blocked`, which is terminal and read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Outcome, with every re-validation check that ran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationActionResult"

  /copilot/recommendations/{id}/reject:
    post:
      operationId: rejectRecommendation
      tags: [bot]
      summary: Decline a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationActionResult"

  /copilot/recommendations/{id}/modify:
    post:
      operationId: modifyRecommendation
      tags: [bot]
      summary: Create a user-authored variant of a recommendation
      description: >
        Does NOT edit the plan. Creates a NEW plan referencing the original,
        authored by you and re-validated from scratch; the original is marked
        `superseded` and keeps its numbers forever. That is what lets a later
        post-mortem say whether a loss was the engine's decision or yours.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slPrice: { type: number }
                tpPrice: { type: number }
                qty: { type: number }
      responses:
        "200":
          description: Outcome, including the new plan's id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationActionResult"

  /notifications:
    get:
      operationId: getNotifications
      tags: [bot]
      summary: Get in-app notifications
      description: >
        The in-app channel for the same alerts that fire the risk-alert
        webhook (circuit breaker, risk pause, untracked-position detection,
        startup reconciliation failures) — visible even if no webhook is
        configured. Unread-first (newest first within that), cursor
        paginated via ?before=<id>.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return rows with id lower than this (cursor pagination)
          schema: { type: integer }
        - name: unreadOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications, with the current unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [bot]
      summary: Mark one notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean } }

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [bot]
      summary: Mark all of this section's notifications as read
      responses:
        "200":
          description: Marked all read
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean } }

  /bot/blocking-summary:
    get:
      operationId: getBlockingSummary
      tags: [bot]
      summary: Get blocking summary
      description: Aggregated explanation of why trades are or are not being executed
      responses:
        "200":
          description: Blocking summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockingSummary"

  /market/live:
    get:
      operationId: getMarketLive
      tags: [market]
      summary: Get live market monitor
      description: Returns real-time ticker snapshots and exchange connection health
      responses:
        "200":
          description: Live market monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketMonitor"

  /portfolio/correlation:
    get:
      operationId: getPortfolioCorrelation
      tags: [portfolio]
      summary: Correlation heat map across the configured pairs
      description: >-
        Pairwise Pearson correlation of daily log returns over a 30-day
        lookback, plus which symbols currently hold a position. A cell is null
        when the two symbols share fewer than `minObservations` days of
        history — never 0, which would read as "measured, and unrelated".
      responses:
        "200":
          description: Correlation heat map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrelationHeatMap"

  /knowledge:
    get:
      operationId: getKnowledge
      tags: [knowledge]
      summary: Market knowledge cells and confidence calibration
      description: >-
        What this account's own closed trades support saying, as of now. Cells
        below `minSamples` report their counts and null for every rate — never a
        provisional figure. Cells above it are tested against the account
        baseline with an exact binomial test and a Benjamini–Hochberg correction
        across the whole family, so `significant` accounts for the fact that
        slicing a history finely enough always produces a winner. Demo and live
        records are never pooled; `executionTarget` says which one this is.
      responses:
        "200":
          description: Knowledge cells plus the calibration report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeOverview"

  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: List all trades
      description: Returns trade log with optional status and source filter
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, stopped]
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [live, backtest]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get trade by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "404":
          description: Trade not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get performance summary
      description: Returns aggregate stats including win rate and total PnL
      responses:
        "200":
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/daily:
    get:
      operationId: getDailyStats
      tags: [stats]
      summary: Get daily statistics
      description: Returns today's hourly trading breakdown
      responses:
        "200":
          description: Daily stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStats"

  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [stats]
      summary: Get the daily trade report
      description: >-
        Full report for one UTC calendar day — summary, per-strategy and
        per-symbol breakdowns, exit reasons, and every closed trade. The same
        report is pushed to the alert webhook automatically at UTC midnight
        for the day that just ended.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "UTC day, YYYY-MM-DD. Defaults to today."
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  /stats/hourly:
    get:
      operationId: getHourlyStats
      tags: [stats]
      summary: Get hourly PnL breakdown
      description: Returns per-hour performance data used for toxic hour detection
      responses:
        "200":
          description: Hourly breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourlyStat"

  /memory/blacklist:
    get:
      operationId: getBlacklist
      tags: [memory]
      summary: Get blacklisted symbols
      description: Returns symbols currently blacklisted by the adaptive learning engine
      responses:
        "200":
          description: Blacklist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlacklistEntry"

  /memory/toxic-hours:
    get:
      operationId: getToxicHours
      tags: [memory]
      summary: Get toxic hours
      description: Returns UTC hours blocked by the adaptive learning engine
      responses:
        "200":
          description: Toxic hour list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToxicHour"

  /memory/influence:
    get:
      operationId: getMemoryInfluence
      tags: [memory]
      summary: Gated memory influence — status, rules, and audit trail
      description: >-
        The only mechanism by which the account's own history changes what the
        engine does. Memory can raise the confidence bar a plan must clear; it
        can never lower one and never originate a plan, so the worst case of a
        bad rule is a trade not taken. `active` is true only when the user
        enabled it, qualifying cells exist, and — on live — a walk-forward
        validation approved this exact rule-set version.
      responses:
        "200":
          description: Influence status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryInfluenceStatus"
    patch:
      operationId: updateMemoryInfluence
      tags: [memory]
      summary: Enable, disable, or bound memory influence
      description: >-
        Disabling is the kill switch: it clears the flag, the approved version
        and the cached state together, and the next scan is already inert.
        Enabling here never grants LIVE permission on its own — only a passing
        walk-forward validation does that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryInfluence"
      responses:
        "200":
          description: Resulting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryInfluenceToggle"

  /memory/influence/validate:
    post:
      operationId: runMemoryValidation
      tags: [memory]
      summary: Walk-forward validation of memory influence
      description: >-
        Fits cells on an earlier window and tests them on a later one the fit
        never saw, against the same window with memory off. `no_better` is a
        first-class verdict and the expected one on most accounts. Only
        `improved` writes the approval that unlocks live influence, and only
        for that exact rule-set version.
      responses:
        "200":
          description: Validation verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryValidationResult"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get bot configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"

    put:
      operationId: updateConfig
      tags: [config]
      summary: Update bot configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/binance-credentials:
    get:
      operationId: getBinanceCredentials
      tags: [credentials]
      summary: Get the logged-in user's Binance credential status
      description: >-
        Never returns the plaintext API key/secret — only whether one is
        configured and a masked preview (last 4 chars of the key).
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BinanceCredentialsStatus"

    put:
      operationId: setBinanceCredentials
      tags: [credentials]
      summary: Set the logged-in user's Binance API key/secret
      description: >-
        Encrypted at rest (AES-256-GCM) and linked only to the logged-in
        user's account. The bot engine only reads credentials at start(), so
        restart the bot (if running) for a changed credential to take effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey:
                  type: string
                apiSecret:
                  type: string
      responses:
        "200":
          description: Credentials updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BinanceCredentialsStatus"
        "400":
          description: apiKey/apiSecret missing

    delete:
      operationId: deleteBinanceCredentials
      tags: [credentials]
      summary: Remove the logged-in user's stored Binance credentials
      responses:
        "200":
          description: Credentials removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BinanceCredentialsStatus"

  /me/oanda-credentials:
    get:
      operationId: getOandaCredentials
      tags: [credentials]
      summary: Get the logged-in user's OANDA credential status (forex section)
      description: >-
        Never returns the plaintext token/account id — only whether one is
        configured and a masked preview (last 4 chars of the account id).
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OandaCredentialsStatus"

    put:
      operationId: setOandaCredentials
      tags: [credentials]
      summary: Set the logged-in user's OANDA API token + account id
      description: >-
        Encrypted at rest (AES-256-GCM), same scheme as the Binance keys.
        Practice vs live is decided by the forex section's paper-trading
        toggle at engine start — each OANDA environment only accepts its own
        tokens. Restart the forex engine for a changed credential to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiToken, accountId]
              properties:
                apiToken:
                  type: string
                accountId:
                  type: string
      responses:
        "200":
          description: Credentials updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OandaCredentialsStatus"
        "400":
          description: apiToken/accountId missing

    delete:
      operationId: deleteOandaCredentials
      tags: [credentials]
      summary: Remove the logged-in user's stored OANDA credentials
      responses:
        "200":
          description: Credentials removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OandaCredentialsStatus"

  /backtests/autopsy:
    post:
      operationId: startAutopsy
      tags: [backtests]
      summary: Start an Optimization Autopsy for one strategy (async)
      description: >-
        Sweeps the strategy's real tunable knobs (dollar risk/target,
        confidence, hold time) with the live-parity backtest engine and
        walk-forward validates candidates on a held-out window before any
        suggestion is made. Crypto section only. Poll GET
        /backtests/autopsy/{id} for progress and the final diagnosis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strategyId]
              properties:
                strategyId:
                  type: string
                symbols:
                  type: array
                  items: { type: string }
                  description: "Defaults to your configured crypto pairs (max 4)."
                timeframe:
                  type: string
                  description: "Default 5m."
                days:
                  type: integer
                  description: "Total window length (train = first ⅔, validation = last ⅓). Default 45, range 14-120."
      responses:
        "202":
          description: Autopsy started
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string }
        "400":
          description: Invalid request (unknown strategy, or forex section)
    get:
      operationId: listAutopsies
      tags: [backtests]
      summary: Recent Optimization Autopsies for the logged-in user
      responses:
        "200":
          description: Autopsy runs, newest first (max 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutopsyRun"

  /backtests/autopsy/{id}:
    get:
      operationId: getAutopsy
      tags: [backtests]
      summary: One Optimization Autopsy (poll while running)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The autopsy run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopsyRun"
        "404":
          description: Not found

  /backtests:
    get:
      operationId: listBacktests
      tags: [backtests]
      summary: List all backtest runs
      responses:
        "200":
          description: List of backtest runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BacktestRun"

  /backtests/run:
    post:
      operationId: runBacktest
      tags: [backtests]
      summary: Start a new backtest (async)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRunRequest"
      responses:
        "202":
          description: Backtest started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestStarted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backtests/optimize:
    post:
      operationId: optimizeBacktest
      tags: [backtests]
      summary: Start parameter optimization (async)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "202":
          description: Optimization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestStarted"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backtests/{id}:
    get:
      operationId: getBacktest
      tags: [backtests]
      summary: Get backtest run detail (run + trades + equity curve)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Backtest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBacktest
      tags: [backtests]
      summary: Delete a backtest run and all its data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /strategies:
    get:
      operationId: getStrategies
      tags: [strategies]
      summary: List all strategies with config and performance
      description: Returns all 6 built-in strategies with their current configuration and lifetime performance metrics
      responses:
        "200":
          description: Strategy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyInfo"

  /custom-strategies:
    get:
      operationId: getCustomStrategies
      tags: [strategies]
      summary: List this user's custom strategies (section-scoped)
      responses:
        "200":
          description: Custom strategy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomStrategy"
    post:
      operationId: createCustomStrategy
      tags: [strategies]
      summary: Create a custom strategy (no-code builder)
      description: Rules are validated server-side against the builder's bounded indicator vocabulary. The new strategy starts DISABLED with no dollar plan, and must complete a single-strategy backtest before it can be enabled for live trading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomStrategyCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomStrategy"
        "400":
          description: Invalid name or rules, or per-section limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /custom-strategies/{id}:
    put:
      operationId: updateCustomStrategy
      tags: [strategies]
      summary: Update a custom strategy
      description: Editing the rules resets the backtest stamp — the strategy must be re-backtested before it can be (re-)enabled for live trading.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomStrategyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomStrategy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCustomStrategy
      tags: [strategies]
      summary: Delete a custom strategy (and its risk/exit config)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, strategyId]
                properties:
                  success:
                    type: boolean
                  strategyId:
                    type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /strategies/signals:
    get:
      operationId: getStrategySignals
      tags: [strategies]
      summary: Live ranked opportunity signals
      description: Returns the most recent scanner results enriched with the strategy that fired
      responses:
        "200":
          description: Ranked signal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategySignalItem"

  /strategies/{id}:
    put:
      operationId: updateStrategyConfig
      tags: [strategies]
      summary: Update strategy configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyConfigUpdate"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                type: object
                required: [success, strategyId]
                properties:
                  success:
                    type: boolean
                  strategyId:
                    type: string
        "404":
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backtests/{id}/export:
    get:
      operationId: exportBacktest
      tags: [backtests]
      summary: Export backtest trades as CSV or JSON
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Export data
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tc_session
      description: >-
        Signed, stateless session cookie set by POST /auth/login. Used by
        the web dashboard — the browser attaches it automatically.
    basicAuth:
      type: http
      scheme: basic
      description: >-
        `Authorization: Basic <base64(OPERATOR_USERNAME:OPERATOR_PASSWORD)>`
        — for scripts, curl, or a non-browser client. Same shared credentials
        as sessionCookie; this is just the non-cookie way to present them.
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BotStatus:
      type: object
      required: [running, dailyPnl, openPositions, totalTradesToday, winRateToday, circuitBreakerActive, riskPaused, mode]
      properties:
        running:
          type: boolean
        balanceUsdt:
          type: ["number", "null"]
          description: "Free USDT on the connected exchange environment; null when the engine is stopped."
        dailyPnl:
          type: number
        openPositions:
          type: integer
        totalTradesToday:
          type: integer
        winRateToday:
          type: number
        circuitBreakerActive:
          type: boolean
        riskPaused:
          type: boolean
          description: "True when trading is suspended after 3 consecutive risk violations — see POST /bot/reset-risk-pause."
        mode:
          type: string
          enum: [live, testnet, backtest]
        startedAt:
          type: ["string", "null"]
          format: date-time
        lastScanAt:
          type: ["string", "null"]
          format: date-time

    IndicatorVote:
      type: object
      required: [name, signal, weight, value]
      properties:
        name:
          type: string
        signal:
          type: string
          enum: [bullish, bearish, neutral]
        weight:
          type: number
        value:
          type: number

    ScannerRow:
      type: object
      required: [symbol, confidence, rsi, atrPercent, status, ema5AboveEma20, macroBullish, volumeRatio, regime, adx, macdHistogram, atrAbs, votes]
      properties:
        symbol:
          type: string
        confidence:
          type: number
        rsi:
          type: number
        atrPercent:
          type: number
        status:
          type: string
          enum: [watching, entered, blacklisted, skipped]
        ema5AboveEma20:
          type: boolean
        macroBullish:
          type: boolean
        volumeRatio:
          type: number
        lastPrice:
          type: number
        regime:
          type: string
          enum: [strong_trend, weak_trend, range, high_volatility, low_volatility]
        adx:
          type: number
        macdHistogram:
          type: number
        atrAbs:
          type: number
        votes:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorVote"
        strategyId:
          type: string
        strategyName:
          type: string
        entryReason:
          type: string
        side:
          type: string
          enum: [long, short]

    PipelineStage:
      type: object
      required: [name, status, detail]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, skip]
        detail:
          type: string
        data:
          type: object
          additionalProperties: true

    SymbolDecision:
      type: object
      required: [symbol, timestamp, confidence, finalDecision, blockStage, blockReason, stages]
      properties:
        symbol:
          type: string
        timestamp:
          type: string
        confidence:
          type: number
        finalDecision:
          type: string
          enum: [ENTERED, BLOCKED]
        blockStage:
          type: ["string", "null"]
        blockReason:
          type: ["string", "null"]
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"

    StrategyDecisionEntry:
      type: object
      required: [id, createdAt, symbol, strategyId, kind, occurrences, lastSeenAt]
      properties:
        id:
          type: integer
        createdAt:
          type: string
        symbol:
          type: string
        strategyId:
          type: string
        strategyName:
          type: ["string", "null"]
        kind:
          type: string
          enum: [executed, approved_not_taken, rejected]
        side:
          type: ["string", "null"]
        confidence:
          type: ["number", "null"]
        stage:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        report:
          description: DecisionReport for rejections; the full TradePlan for approved/executed decisions.
          type: ["object", "null"]
          additionalProperties: true
        tradeId:
          type: ["integer", "null"]
        occurrences:
          type: integer
        lastSeenAt:
          type: string

    Recommendation:
      type: object
      required: [id, status, authoredBy, symbol, strategyId, side, confidence, entryPrice, slPrice, tpPrice, qty, leverage, planFingerprint, expiresAt, createdAt]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [created, executed, rejected, expired, superseded, blocked]
        authoredBy:
          type: string
          enum: [engine, user]
          description: "\"user\" marks a plan the trader modified — outcome attribution depends on it."
        derivedFromId:
          type: ["integer", "null"]
        symbol: { type: string }
        strategyId: { type: string }
        strategyName: { type: ["string", "null"] }
        side: { type: string, enum: [long, short] }
        confidence: { type: number }
        entryPrice: { type: number }
        slPrice: { type: number }
        tpPrice: { type: number }
        qty: { type: number }
        leverage: { type: integer }
        planFingerprint:
          type: string
          description: "SHA-256 of the decision content. Identical to the plan AutoPilot would have executed for the same scan."
        entryReason: { type: ["string", "null"] }
        expiresAt: { type: string }
        createdAt: { type: string }
        actedAt: { type: ["string", "null"] }
        tradeId: { type: ["integer", "null"] }
        resolutionReason: { type: ["string", "null"] }

    RecommendationList:
      type: object
      required: [recommendations]
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"

    RevalidationCheck:
      type: object
      required: [name, passed, detail]
      properties:
        name: { type: string }
        passed: { type: boolean }
        detail: { type: string }

    RecommendationActionResult:
      type: object
      required: [ok, status, reason]
      properties:
        ok: { type: boolean }
        status:
          type: string
          enum: [created, executed, rejected, expired, superseded, blocked]
        reason: { type: string }
        checks:
          type: array
          description: "Every re-validation check that ran, pass or fail — not just the first failure."
          items:
            $ref: "#/components/schemas/RevalidationCheck"
        tradeId: { type: integer }
        newRecommendationId:
          type: integer
          description: "Set by modify(): the new user-authored plan."

    PortfolioImpact:
      type: object
      required: [currentOpenPositions, maxOpenPositions, candidateRiskUsdt, currentPortfolioRiskUsdt, afterPortfolioRiskUsdt, maxPortfolioRiskUsdt]
      properties:
        currentOpenPositions: { type: integer }
        maxOpenPositions: { type: integer }
        candidateRiskUsdt:
          type: number
          description: "This plan's own worst-case dollar risk: |entry − stop| × qty."
        currentPortfolioRiskUsdt: { type: number }
        afterPortfolioRiskUsdt:
          type: number
          description: "currentPortfolioRiskUsdt + candidateRiskUsdt — what the cap would read if this trade executes."
        maxPortfolioRiskUsdt: { type: number }

    CellStats:
      type: object
      required: [samples, wins, losses, scratches, gated, minSamples, winRate, winRateLow, winRateHigh, expectancyUsdt, profitFactor, avgR, netPnlUsdt]
      description: >-
        Outcome summary for one bucket of closed trades. Counts and net P&L are
        facts and are always present; every rate is null while `gated` is true.
      properties:
        samples: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        scratches:
          type: integer
          description: "Break-even washes — excluded from the win-rate denominator, not counted as losses."
        gated:
          type: boolean
          description: "samples < minSamples. Every rate below is null."
        minSamples: { type: integer }
        winRate:
          type: ["number", "null"]
          description: "Scratch-adjusted: wins / (wins + losses)."
        winRateLow:
          type: ["number", "null"]
          description: "Lower bound of the 95% Wilson interval on winRate."
        winRateHigh: { type: ["number", "null"] }
        expectancyUsdt: { type: ["number", "null"] }
        profitFactor: { type: ["number", "null"] }
        avgR: { type: ["number", "null"] }
        netPnlUsdt: { type: number }

    CellSignificance:
      type: object
      required: [pValue, qValue, significant]
      properties:
        pValue:
          type: number
          description: "Exact two-sided binomial test against the account baseline win rate."
        qValue:
          type: number
          description: "Benjamini–Hochberg adjusted p-value: the false-discovery rate incurred by treating this cell as a real edge."
        significant:
          type: boolean
          description: "qValue is within the family's FDR budget."

    KnowledgeCell:
      allOf:
        - $ref: "#/components/schemas/CellStats"
        - type: object
          required: [dimension, key, label, significance]
          properties:
            dimension:
              type: string
              enum: [strategy_regime, symbol_strategy, session, volatility]
            key: { type: string }
            label: { type: string }
            significance:
              oneOf:
                - $ref: "#/components/schemas/CellSignificance"
                - type: "null"
              description: "Null when the cell is gated, or when there is no trustworthy baseline to test against."

    ReliabilityBin:
      type: object
      required: [low, high, count, meanPredicted, observedRate]
      properties:
        low: { type: number }
        high: { type: number }
        count: { type: integer }
        meanPredicted: { type: ["number", "null"] }
        observedRate:
          type: ["number", "null"]
          description: "Observed win frequency in the bin. Perfect calibration puts this on the diagonal."

    CalibrationScores:
      type: object
      required: [brier, logLoss, ece]
      properties:
        brier: { type: ["number", "null"] }
        logLoss: { type: ["number", "null"] }
        ece:
          type: ["number", "null"]
          description: "Expected Calibration Error — sample-weighted average gap between promised and observed frequency."

    CalibrationReport:
      type: object
      required: [gated, minSamples, totalSamples, trainSamples, validationSamples, samplesNeeded, raw, calibrated, climatologyBrier, beatsClimatology, bins]
      description: >-
        Whether strategy confidence behaves like a probability on this account's
        record. Fitted on an earlier chronological slice and scored on a later
        one — never on its own training data. Gated on the VALIDATION set, since
        that is where every published number is measured.
      properties:
        gated: { type: boolean }
        minSamples: { type: integer }
        totalSamples: { type: integer }
        trainSamples: { type: integer }
        validationSamples: { type: integer }
        samplesNeeded:
          type: integer
          description: "Further validation-set trades needed to open the gate; 0 once open."
        raw:
          $ref: "#/components/schemas/CalibrationScores"
        calibrated:
          $ref: "#/components/schemas/CalibrationScores"
        climatologyBrier:
          type: ["number", "null"]
          description: "Brier score of predicting the base rate for every trade — the bar any calibration must clear to be worth anything."
        beatsClimatology:
          type: boolean
          description: "calibrated.brier < climatologyBrier. False means confidence carries no usable information on this record."
        bins:
          type: array
          items:
            $ref: "#/components/schemas/ReliabilityBin"

    KnowledgeOverview:
      type: object
      required: [executionTarget, asOf, totalTrades, baselineWinRate, minSamples, fdr, cellsTested, cells, calibration]
      properties:
        executionTarget:
          type: string
          enum: [demo, live]
          description: "Which record these numbers describe. Demo and live are never pooled."
        asOf:
          type: string
          description: "The point-in-time cut. Every claim is 'given only what was knowable at this moment'."
        totalTrades: { type: integer }
        baselineWinRate:
          type: ["number", "null"]
          description: "The account's own scratch-adjusted win rate — the null hypothesis each cell is tested against. Null below the gate."
        minSamples: { type: integer }
        fdr:
          type: number
          description: "False-discovery-rate budget for the significance family."
        cellsTested:
          type: integer
          description: "How many cells entered the multiple-comparison family."
        cells:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeCell"
        calibration:
          $ref: "#/components/schemas/CalibrationReport"

    InfluenceRule:
      type: object
      required: [dimension, key, label, samples, winRate, baselineWinRate, qValue, delta]
      description: >-
        One knowledge cell memory is acting on. Present only for cells that
        cleared the sample gate AND whose q-value survived the
        multiple-comparison correction.
      properties:
        dimension:
          type: string
          enum: [strategy_regime, symbol_strategy, session, volatility]
        key: { type: string }
        label: { type: string }
        samples: { type: integer }
        winRate: { type: number }
        baselineWinRate: { type: number }
        qValue: { type: number }
        delta:
          type: number
          description: "Confidence points this cell adds to the bar. Always positive — memory only tightens."

    MemoryArmMetrics:
      type: object
      required: [trades, wins, losses, winRate, netPnlUsdt, expectancyUsdt]
      properties:
        trades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: ["number", "null"] }
        netPnlUsdt: { type: number }
        expectancyUsdt: { type: number }

    MemoryValidationSummary:
      type: object
      required: [id, status, verdict, summary, stateVersion, executionTarget, trainTrades, validationTrades, withheld, withheldPnlUsdt, expectancyDelta, createdAt]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pending, running, completed, failed]
        verdict:
          type: ["string", "null"]
          enum: [improved, no_better, insufficient_data, null]
        summary: { type: ["string", "null"] }
        stateVersion:
          type: ["string", "null"]
          description: "The rule-set version this run approved. Permission is version-scoped — a refit revokes it."
        executionTarget: { type: string }
        trainTrades: { type: integer }
        validationTrades: { type: integer }
        withheld: { type: integer }
        withheldPnlUsdt: { type: ["number", "null"] }
        expectancyDelta: { type: ["number", "null"] }
        createdAt: { type: string }

    MemoryValidationResult:
      type: object
      required: [verdict, summary, stateVersion, trainTrades, validationTrades, withheld, withheldPnlUsdt, expectancyDelta, baseline, withMemory, rules]
      properties:
        verdict:
          type: string
          enum: [improved, no_better, insufficient_data]
        summary: { type: string }
        stateVersion: { type: string }
        trainTrades: { type: integer }
        validationTrades: { type: integer }
        withheld:
          type: integer
          description: "Out-of-sample trades memory would have withheld."
        withheldPnlUsdt:
          type: number
          description: "P&L of the withheld trades. Negative is the point."
        expectancyDelta: { type: number }
        baseline:
          $ref: "#/components/schemas/MemoryArmMetrics"
        withMemory:
          $ref: "#/components/schemas/MemoryArmMetrics"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/InfluenceRule"

    AppliedInfluence:
      type: object
      required: [id, symbol, strategyId, admitted, confidence, requiredConfidence, delta, memoryVersion, executionTarget, reason, createdAt]
      description: >-
        One time memory raised a plan's bar. Both outcomes are recorded —
        logging only the withheld trades would read as a list of saves and hide
        every time a rule fired harmlessly.
      properties:
        id: { type: integer }
        symbol: { type: string }
        strategyId: { type: string }
        admitted:
          type: boolean
          description: "True when the plan cleared the raised bar anyway."
        confidence: { type: number }
        requiredConfidence: { type: number }
        delta: { type: number }
        memoryVersion: { type: string }
        executionTarget: { type: string }
        reason: { type: string }
        createdAt: { type: string }

    MemoryInfluenceStatus:
      type: object
      required: [enabled, maxDelta, approvedVersion, active, needsValidation, executionTarget, reason, summary, version, rules, latestValidation, recent]
      properties:
        enabled:
          type: boolean
          description: "What the user asked for. Not the same as `active`."
        maxDelta:
          type: number
          description: "Hard cap in confidence points, applied after summing every matching cell."
        approvedVersion: { type: ["string", "null"] }
        active:
          type: boolean
          description: "Whether the engine is actually acting on memory right now."
        needsValidation:
          type: boolean
          description: "Live influence is requested but blocked for want of a matching passing validation."
        executionTarget: { type: string }
        reason: { type: string }
        summary: { type: string }
        version:
          type: string
          description: "\"memory-0\" when inert; \"memory-1:<hash>\" when it carries rules."
        rules:
          type: array
          items:
            $ref: "#/components/schemas/InfluenceRule"
        latestValidation:
          oneOf:
            - $ref: "#/components/schemas/MemoryValidationSummary"
            - type: "null"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/AppliedInfluence"

    UpdateMemoryInfluence:
      type: object
      properties:
        enabled: { type: boolean }
        maxDelta:
          type: number
          minimum: 0
          maximum: 25
          description: "Hard cap in confidence points. Bounded server-side; memory is not permitted an unlimited reach."

    MemoryInfluenceToggle:
      type: object
      required: [enabled, active, needsValidation, version, reason]
      properties:
        enabled: { type: boolean }
        active: { type: boolean }
        needsValidation: { type: boolean }
        version: { type: string }
        reason: { type: string }

    SimilarMatch:
      type: object
      required: [tradeId, symbol, strategyId, closedAt, similarity, pnl, rMultiple, outcome]
      properties:
        tradeId: { type: integer }
        symbol: { type: string }
        strategyId: { type: ["string", "null"] }
        closedAt: { type: number, description: "Epoch milliseconds the outcome was settled." }
        similarity:
          type: number
          description: "Cosine similarity on z-score-normalised feature vectors, in [-1, 1]."
        pnl: { type: number }
        rMultiple: { type: ["number", "null"] }
        outcome:
          type: string
          enum: [win, loss, scratch]

    SimilarTrades:
      type: object
      required: [available, reason, poolSize, minPoolSize, similarityFloor, matches, stats, featuresUsed]
      description: >-
        Closed trades whose entry conditions resembled the candidate. Cosine
        similarity over z-scored vectors — raw cosine would be dominated by
        whichever features have the largest magnitude. A similarity FLOOR comes
        before any top-N cap, so a sparse account gets "nothing comparable"
        rather than its N least-dissimilar trades. `reason` is always populated.
      properties:
        available: { type: boolean }
        reason: { type: string }
        poolSize:
          type: integer
          description: "Closed trades carrying recorded indicator readings."
        minPoolSize:
          type: integer
          description: "Pool needed before z-scores are trustworthy enough to normalise with."
        similarityFloor: { type: number }
        matches:
          type: array
          items:
            $ref: "#/components/schemas/SimilarMatch"
        stats:
          oneOf:
            - $ref: "#/components/schemas/CellStats"
            - type: "null"
          description: "Aggregate outcome of the matches, gated separately — individual trades are facts, their win rate is an estimate."
        featuresUsed:
          type: array
          items: { type: string }

