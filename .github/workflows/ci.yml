name: CI

# The repo had 15 passing harness tests and nothing that ran them. This runs
# them on every push and PR, so a regression is caught before it reaches the
# VPS rather than after.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deliberately NOT set: TRADECORE_ALLOW_SYNTHETIC_CANDLES. CI must exercise
  # the same refusal a production backtest would hit on harness-seeded data.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The live-engine integration test drives the real BotEngine against a
    # scripted mock exchange, but needs a real database for its assertions.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradecore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Builds the lib/* project references first, then typechecks every
      # artifact — matches the root `typecheck` script developers run.
      - name: Typecheck
        run: pnpm run typecheck

      # Pure tests: no database, no network. Includes the determinism suite
      # (same inputs ⇒ identical TradePlan fingerprint) and the metrics-kernel
      # suite (one definition per metric, no silently changed numbers).
      - name: Test (pure)
        run: pnpm --filter @workspace/api-server run test

      - name: Test deployment lifecycle
        run: pnpm run test:deployment

      - name: Create legacy and separated database roles
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tradecore LOGIN PASSWORD 'legacy-ci-only';
          CREATE ROLE tradecore_owner LOGIN PASSWORD 'owner-ci-only';
          CREATE ROLE tradecore_runtime LOGIN PASSWORD 'runtime-ci-only';
          ALTER DATABASE tradecore OWNER TO tradecore;
          ALTER SCHEMA public OWNER TO tradecore;
          SQL
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/tradecore

      - name: Prepare populated legacy blacklist schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.blacklist_entries (
            id serial PRIMARY KEY,
            symbol text NOT NULL,
            user_id integer NOT NULL,
            section text DEFAULT 'crypto' NOT NULL,
            win_rate numeric(5, 4) NOT NULL,
            trade_count integer NOT NULL,
            blacklisted_at timestamp with time zone DEFAULT now() NOT NULL,
            expires_at timestamp with time zone NOT NULL,
            CONSTRAINT blacklist_user_section_symbol_unique
              UNIQUE (user_id, section, symbol)
          );
          CREATE INDEX blacklist_user_expires_at_idx
            ON public.blacklist_entries (user_id, expires_at);
          INSERT INTO public.blacklist_entries (
            user_id, section, symbol, win_rate, trade_count, blacklisted_at, expires_at
          )
          SELECT
            910000 + series,
            CASE WHEN series % 2 = 0 THEN 'crypto' ELSE 'forex' END,
            'PHASE10-REGRESSION-' || series,
            0.2500,
            10,
            now(),
            now() + interval '1 day'
          FROM generate_series(1, 38) series;
          SQL
        env:
          DATABASE_URL: postgres://tradecore:legacy-ci-only@localhost:5432/tradecore

      - name: Test populated schema deployment regression
        run: bash scripts/sql/harness/schema-deployment.test.sh
        env:
          DATABASE_MIGRATION_URL: postgres://tradecore:legacy-ci-only@localhost:5432/tradecore

      - name: Migrate legacy database ownership
        run: >-
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1
          -v database_name=tradecore -v legacy_role=tradecore
          -v owner_role=tradecore_owner -v app_role=tradecore_runtime
          -f scripts/sql/harden-database-roles.sql
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/tradecore

      - name: Apply and test post-schema database security
        run: |
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 \
            -v owner_role=tradecore_owner -v app_role=tradecore_runtime \
            -f scripts/sql/capture-grants.sql
          bash scripts/sql/harness/database-security.test.sh
        env:
          DATABASE_MIGRATION_URL: postgres://tradecore_owner:owner-ci-only@localhost:5432/tradecore
          TRADECORE_DATABASE_OWNER_ROLE: tradecore_owner
          TRADECORE_RUNTIME_ROLE: tradecore_runtime
          RUN_PSQL12_COMPAT: "1"

      - name: Test (integration)
        run: pnpm --filter @workspace/api-server run test:integration
        env:
          DATABASE_URL: postgres://tradecore_runtime:runtime-ci-only@localhost:5432/tradecore

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Restricted Live browser regression
        run: |
          PORT=8090 BASE_PATH=/ pnpm --filter @workspace/tradecore-pro run build
          pnpm --filter @workspace/tradecore-pro run serve -- --port 4173 > /tmp/restricted-live-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/restricted-live > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/restricted-live-preview.log
              exit 1
            fi
            sleep 1
          done
          pnpm --filter @workspace/tradecore-pro run test:restricted-live-browser

      - name: Test (Phase 7 browser regression)
        run: pnpm run test:e2e

      # Catches a broken build before deploy, and is the same command the VPS
      # runs (docs/HANDOFF.md §4). Frontend FIRST — the backend build copies
      # its output into dist/public. PORT is required by vite.config.ts; the
      # value only bakes the dev-proxy target, so any port works here.
      - name: Build
        run: |
          PORT=8090 BASE_PATH=/ pnpm --filter @workspace/tradecore-pro run build
          pnpm --filter @workspace/api-server run build
